<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Pane</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1f2a37;
            --muted: #5b6878;
            --line: #dde3ea;
            --accent: #1e6bae;
            --accent-soft: #e8f1fa;
            --right: #1b7f3b;
            --right-soft: #e7f6ec;
            --wrong: #c62828;
            --wrong-soft: #fdecec;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 17px;
            line-height: 1.5;
        }

        body {
            padding: 24px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
            line-height: 1.4;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .sign {
            margin: 0 0 18px;
        }

        .sign svg {
            display: block;
            width: 120px;
            height: 120px;
        }

        .choices {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .choice {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 12px 14px;
            border: 2px solid var(--line);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.12s, background 0.12s;
        }

        .choice:hover {
            border-color: #b9c6d4;
        }

        .choice input {
            margin: 4px 0 0;
            accent-color: var(--accent);
            flex: none;
        }

        .choice.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .choice.locked {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .choice.locked.selected {
            opacity: 1;
        }

        .key {
            flex: none;
            width: 1.6em;
            color: var(--muted);
            font-weight: 600;
        }

        .note {
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Intro */
        .intro ul {
            margin: 0 0 12px;
            padding-left: 1.2em;
        }

        .intro li {
            margin-bottom: 6px;
        }

        /* Summary */
        .summary-head {
            margin-bottom: 20px;
        }

        .summary-head p {
            margin: 0;
            color: var(--muted);
        }

        .item {
            padding: 18px 0;
            border-top: 1px solid var(--line);
        }

        .item h3 {
            margin: 0 0 12px;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .item .num {
            color: var(--muted);
            font-weight: 600;
            margin-right: 6px;
        }

        .item .sign svg {
            width: 84px;
            height: 84px;
        }

        .badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            vertical-align: 2px;
        }

        .badge.ok {
            background: var(--right-soft);
            color: var(--right);
        }

        .badge.miss {
            background: var(--wrong-soft);
            color: var(--wrong);
        }

        .opts {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        .opts li {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            color: var(--muted);
        }

        .opts li.correct {
            color: var(--right);
            background: var(--right-soft);
            border-color: #b7e0c4;
            font-weight: 600;
        }

        .opts li.wrong {
            color: var(--wrong);
            background: var(--wrong-soft);
            border-color: #f3c0c0;
            font-weight: 600;
            text-decoration: line-through;
        }

        .opts .tag {
            float: right;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .why {
            margin: 10px 0 0;
            font-size: 0.92rem;
            color: var(--muted);
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            html,
            body {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main id="root" aria-live="polite"></main>

    <script>
        // The question pane only renders what the parent sends it and reports
        // clicks back; all quiz state and logic lives in the parent page.
        const root = document.getElementById("root");
        const LETTERS = "ABCDEFGH";

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function send(msg) {
            window.parent.postMessage(Object.assign({ source: "quiz-pane" }, msg), "*");
        }

        function reportHeight() {
            send({ type: "height", height: document.documentElement.scrollHeight });
        }

        function signBlock(svg, className) {
            const wrap = el("div", className || "sign");
            // Sign SVG comes from the quiz's own question data, not user input.
            wrap.innerHTML = svg;
            return wrap;
        }

        function renderIntro(data) {
            root.replaceChildren();
            const box = el("div", "intro");
            box.append(el("p", "eyebrow", "Before you begin"));
            box.append(el("h2", null, data.heading));
            const list = el("ul");
            data.points.forEach((p) => list.append(el("li", null, p)));
            box.append(list);
            box.append(el("p", "note", "Press Start Quiz above when you're ready."));
            root.append(box);
        }

        function renderQuestion(data) {
            root.replaceChildren();
            root.append(el("p", "eyebrow", "Question " + data.number + " of " + data.total));
            root.append(el("h2", null, data.question));
            if (data.image) root.append(signBlock(data.image));

            const set = el("fieldset", "choices");
            set.setAttribute("aria-label", "Answer choices");
            data.choices.forEach((text, i) => {
                const label = el("label", "choice");
                const input = document.createElement("input");
                input.type = "radio";
                input.name = "answer";
                input.value = i;
                input.checked = data.selected === i;
                input.disabled = data.locked;
                if (data.selected === i) label.classList.add("selected");
                if (data.locked) label.classList.add("locked");
                input.addEventListener("change", () => send({ type: "select", choice: i }));
                label.append(input, el("span", "key", LETTERS[i] + "."), el("span", null, text));
                set.append(label);
            });
            root.append(set);

            if (data.locked) {
                root.append(el("p", "note", "This answer is locked. Turn on editing in the header to change it."));
            }
        }

        function renderSummary(data) {
            root.replaceChildren();
            const head = el("div", "summary-head");
            head.append(el("p", "eyebrow", "Review"));
            head.append(el("h2", null, "Your answers"));
            const missed = data.items.filter((it) => it.selected !== it.answer).length;
            head.append(el("p", null, missed === 0
                ? "You answered every question correctly."
                : missed + " missed. Your wrong answers are in red, the correct answers in green."));
            root.append(head);

            data.items.forEach((it, n) => {
                const ok = it.selected === it.answer;
                const item = el("section", "item");
                const h = el("h3");
                h.append(el("span", "num", (n + 1) + "."), document.createTextNode(it.question));
                h.append(el("span", "badge " + (ok ? "ok" : "miss"), ok ? "Correct" : "Missed"));
                item.append(h);
                if (it.image) item.append(signBlock(it.image));

                const opts = el("ul", "opts");
                it.choices.forEach((text, i) => {
                    const li = el("li");
                    li.append(document.createTextNode(LETTERS[i] + ". " + text));
                    if (i === it.answer) {
                        li.className = "correct";
                        li.append(el("span", "tag", ok ? "✓ Your answer" : "✓ Correct answer"));
                    } else if (i === it.selected) {
                        li.className = "wrong";
                        li.append(el("span", "tag", "✗ Your answer"));
                    }
                    opts.append(li);
                });
                item.append(opts);
                item.append(el("p", "why", it.explanation));
                root.append(item);
            });
        }

        window.addEventListener("message", (event) => {
            if (event.source !== window.parent) return;
            const msg = event.data || {};
            if (msg.source !== "quiz-parent") return;
            if (msg.type === "intro") renderIntro(msg);
            else if (msg.type === "question") renderQuestion(msg);
            else if (msg.type === "summary") renderSummary(msg);
            window.scrollTo(0, 0);
            reportHeight();
        });

        new ResizeObserver(reportHeight).observe(document.body);
        send({ type: "ready" });
    </script>
</body>

</html>
